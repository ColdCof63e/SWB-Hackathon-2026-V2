name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Using npm install handles edge cases where package-lock isn't perfectly synced yet
    - name: Install dependencies
      run: npm install && npm install --prefix server
    
    - name: Build application (if needed)
      run: npm run build

    # - name: Start dev server
    #   run: npm run dev &
    #   # The & runs it in the background so the next step can proceed

    # - name: Wait for server to be ready
    #   run: npx wait-on http://localhost:5173 --timeout 15000

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Boots your Vite development workspace and runs your automated specs
    - name: Run Playwright tests
      run: npx playwright test
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
